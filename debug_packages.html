<!DOCTYPE html>
<html>
<head>
    <title>Package Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        pre { background: #2a2a2a; padding: 15px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; background: #4a4a4a; color: white; border: none; border-radius: 5px; }
        button:hover { background: #5a5a5a; }
        .section { margin: 20px 0; border: 1px solid #444; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Package Debugging Tool</h1>
    
    <div class="section">
        <h2>Current localStorage State</h2>
        <button onclick="showStorage()">Show All Package Data</button>
        <button onclick="clearCustomPackages()">Clear Custom Packages</button>
        <button onclick="clearAllMeta()">Clear All Metadata</button>
        <pre id="storage-output"></pre>
    </div>

    <div class="section">
        <h2>Actions</h2>
        <button onclick="window.location.reload()">Reload Page</button>
    </div>

    <script>
        function showStorage() {
            const output = document.getElementById('storage-output');
            const data = {
                customPackages: JSON.parse(localStorage.getItem('customServicePackages') || '[]'),
                customAddOns: JSON.parse(localStorage.getItem('customAddOns') || '[]'),
                packageMeta: JSON.parse(localStorage.getItem('packageMeta') || '{}'),
                addOnMeta: JSON.parse(localStorage.getItem('addOnMeta') || '{}')
            };
            output.textContent = JSON.stringify(data, null, 2);
        }

        function clearCustomPackages() {
            localStorage.setItem('customServicePackages', '[]');
            localStorage.setItem('customAddOns', '[]');
            alert('Custom packages cleared! Click "Show All Package Data" to verify.');
        }

        function clearAllMeta() {
            localStorage.setItem('packageMeta', '{}');
            localStorage.setItem('addOnMeta', '{}');
            alert('All metadata cleared! Click "Show All Package Data" to verify.');
        }

        // Auto-show on load
        showStorage();
    </script>
</body>
</html>
